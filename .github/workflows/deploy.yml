name: Deploy Diocese of Jalle Website

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}
    
    - name: Install sshpass
      run: |
        sudo apt-get update
        sudo apt-get install -y sshpass

    - name: Setup SSH Known Hosts
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_PORT: ${{ secrets.SSH_PORT }}
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -p ${SSH_PORT:-21098} -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Deploy to Server via SSH
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_PORT: ${{ secrets.SSH_PORT }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_LARAVEL }}
      run: |
        sshpass -p "$SSH_PASSWORD" ssh -p ${SSH_PORT:-21098} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SSH_USER@$SSH_HOST "
          set -e
          cd $DEPLOY_PATH || exit 1

          echo '=== [1/6] Updating Git Remote and Fetching Latest Code ==='
          git remote set-url origin https://Arokrokie:$PAT_TOKEN@github.com/Arokrokie/diocese_of_jalle.git
          git fetch --all
          git reset --hard origin/main

          echo '=== [2/6] Installing Composer Dependencies ==='
          if [ -f composer.phar ]; then
            php composer.phar install --no-interaction --prefer-dist --optimize-autoloader --no-dev
          elif command -v composer &> /dev/null; then
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
          else
            echo 'Warning: Composer not found in PATH or root. Skipping.'
          fi

          echo '=== [3/6] Running Database Migrations ==='
          php artisan migrate --force

          echo '=== [4/6] Linking Storage Directory ==='
          php artisan storage:link || true

          echo '=== [5/6] Optimizing and Caching Configurations ==='
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache || true

          echo '=== [6/6] Enforcing Production File Permissions ==='
          chmod -R 775 storage bootstrap/cache public || true

          echo '=== Deployment Completed Successfully! ==='
        "
